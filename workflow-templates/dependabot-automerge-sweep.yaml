# Nightly sweep that merges open Dependabot PRs already marked eligible by
# the dependabot-automerge workflow. Major updates and anything else that
# failed policy never carry the label, so they always wait for a human.
#
# This is a STARTER. Adopting it writes this file into the repository; it
# does NOT configure repository settings. Read the prerequisites below (and
# in workflow-templates/README.md in bufbuild/.github) before relying on it.
#
# -----------------------------------------------------------------------
# How this pairs with dependabot-automerge (REQUIRED reading)
# -----------------------------------------------------------------------
# The two workflows split the job:
#
#   dependabot-automerge (reactive)  — runs per Dependabot PR, classifies
#     it precisely with dependabot/fetch-metadata (semver level, grouped
#     updates, security alert state), and LABELS eligible PRs with
#     "automerge: eligible". With defer-to-sweep: true it stops there.
#   dependabot-automerge-sweep (this) — runs on a schedule, finds open
#     Dependabot PRs carrying that label, and merges the ones whose CI is
#     green (or that have no CI to wait on). It never classifies anything
#     itself; policy lives only in the reactive workflow.
#
# THIS TEMPLATE DOES NOTHING ALONE. Without the reactive workflow also
# installed, no PR ever gets the label and the sweep finds nothing to
# merge. Install dependabot-automerge first.
#
# No runner time is spent waiting on CI. The sweep takes ONE look at each
# labeled PR: checks all green -> merge; pending or failing -> skip, and
# the next scheduled run retries. By sweep time CI has normally been
# finished for hours, so merges are immediate. PRs on a repository with
# no CI at all merge as-is (announced with a notice): such a repository
# already accepts every change unverified, and the label already vetted
# the update level.
#
# Humans can veto any PR by removing the label; the reactive workflow
# re-evaluates (and re-labels or unlabels) on every Dependabot push.
# -----------------------------------------------------------------------
name: dependabot-automerge-sweep
# Runs on a timer and on manual dispatch. There is intentionally NO
# pull_request trigger: that is the reactive dependabot-automerge
# template's job. Cron fires only on the DEFAULT branch and is suppressed
# after 60 days of repository inactivity.
on:
  schedule:
    - cron: "0 14 * * 1-5" # 14:00 UTC weekdays (9am EST / 10am EDT); adjust to taste
  workflow_dispatch: # allow manual runs from the Actions tab
permissions:
  contents: write
  pull-requests: write
jobs:
  sweep:
    uses: bufbuild/.github/.github/workflows/dependabot-automerge-sweep.yaml@main
    # `with:` is OPTIONAL — every input has a default, so omit the whole
    # block to accept them. To override any input, uncomment `with:` AND
    # the specific line(s) below.
    # with:
    #   merge-method: squash # merge, squash, or rebase
    #   # Label that marks PRs as merge-eligible. Only change this if the
    #   # reactive dependabot-automerge workflow uses the same override —
    #   # the two must match or the sweep finds nothing.
    #   eligibility-label: "automerge: eligible"
    #   # Name of the reactive workflow (its caller stub's `name:`). The
    #   # sweep ignores that workflow's check runs when deciding whether a
    #   # PR has real CI. Only change this if you renamed the reactive
    #   # workflow.
    #   automerge-workflow: dependabot-automerge
