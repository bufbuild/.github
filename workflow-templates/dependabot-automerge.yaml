# Auto-merge Dependabot PRs that match a confidence policy: routine
# patch/minor version bumps. Major updates always wait for a human; adding
# the "automerge: eligible" label by hand is the deliberate override.
# Merges are always squash, per org git standards.
#
# This is a STARTER. Adopting it writes this file into the repository; it
# does NOT configure repository settings. Read the prerequisites for the
# strategy you pick (below and in workflow-templates/README.md in
# bufbuild/.github) before relying on it.
#
# -----------------------------------------------------------------------
# Pick ONE merge strategy
# -----------------------------------------------------------------------
# The two strategies differ only in HOW the merge waits for CI.
#
# A) GitHub native auto-merge  (default; defer-to-sweep omitted)
#    `gh pr merge --auto` hands the PR to GitHub, which merges it once the
#    default branch's REQUIRED status checks pass. It costs no CI minutes.
#    BUT: if the default branch has no required status checks, GitHub has
#    nothing to wait on and merges IMMEDIATELY. Only use this strategy on
#    repositories that have required status checks configured.
#    Prerequisites (do these BEFORE the workflow lands, order matters):
#      1. Add a ruleset / branch protection on the default branch with
#         required status checks naming the CI jobs (e.g. `ci (go:latest)`).
#      2. Enable "Allow auto-merge" (Settings -> General -> Pull Requests).
#
# B) Defer to the nightly sweep  (set defer-to-sweep: true)
#    This workflow only labels eligible PRs; the dependabot-automerge-sweep
#    workflow merges them on its next scheduled run, once CI has finished.
#    Use on repositories with NO required status checks (e.g. repos
#    intentionally left unprotected), where native auto-merge would merge
#    immediately. No runner ever sits waiting on CI: this run exits in
#    seconds, and by sweep time the checks are long terminal. The sweep
#    skips (and retries next night) anything still pending or failing.
#    PRs on a repository with no CI at all merge as-is: such a repository
#    already accepts every change unverified, and the label already
#    vetted the update level.
#    Trade-off: merges land at the sweep's cadence (next morning), not
#    same-hour.
#    Prerequisites: ALSO install the dependabot-automerge-sweep template —
#    without it, labeled PRs never merge.
#
# To switch from A to B: uncomment the `defer-to-sweep: true` line in the
# `with:` block below, and install the sweep template.
# -----------------------------------------------------------------------
name: dependabot-automerge
# Must be a pull_request event: the reusable workflow reads the PR from the
# event payload and gates on the PR author. A `schedule`/cron trigger has no
# pull_request context, so the job would never run — do not add one here.
on: pull_request
permissions:
  contents: write
  pull-requests: write
  # Required for the eligibility label (create + add/remove are
  # Issues-API operations). A reusable workflow's token is bounded by the
  # caller's permissions, so the grant must live here too.
  issues: write
jobs:
  automerge:
    # The reusable workflow authorizes on the PR author; this actor gate
    # additionally skips re-runs when someone other than Dependabot (e.g.
    # a human adding commits) pushes to a Dependabot PR branch.
    if: github.actor == 'dependabot[bot]'
    uses: bufbuild/.github/.github/workflows/dependabot-automerge.yaml@main
    # `with:` is OPTIONAL — every input has a default, so omit the whole
    # block to accept them. To override any input, uncomment `with:` AND
    # the specific line(s) below.
    # with:
    #   # Strategy B (defer to nightly sweep). Set true for repositories
    #   # with no required status checks, and install the
    #   # dependabot-automerge-sweep template too; leave omitted to use
    #   # GitHub native auto-merge (strategy A).
    #   defer-to-sweep: true
    #   target: minor # highest bump to auto-merge: patch or minor
    #   # Label recorded on eligible PRs. The optional nightly
    #   # dependabot-automerge-sweep merges by this label; if you override
    #   # it, override it there too.
    #   eligibility-label: "automerge: eligible"
