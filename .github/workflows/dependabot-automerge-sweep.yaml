# Reusable NIGHTLY sweep: merges open Dependabot PRs that the reactive
# dependabot-automerge workflow has already marked eligible.
#
# Division of labor: the reactive workflow runs per pull_request event,
# where dependabot/fetch-metadata classifies the update precisely (semver
# level, grouped-update members), and records its verdict by labeling
# eligible PRs. This sweep runs on a schedule — where fetch-metadata
# cannot run — and merges open Dependabot PRs bearing that label. Policy
# lives in ONE place; the sweep never classifies anything.
#
# One look per PR, no waiting: any failing or pending check -> skip,
# retried on the next scheduled run. No checks at all -> merge; a
# repository without CI already accepts every change unverified, and the
# label already vetted the update level. Merges are always squash, per
# org git standards.
#
# Humans veto a PR by removing the label, or arm a declined one by adding
# it. The reactive workflow re-evaluates on every Dependabot push.
name: dependabot-automerge-sweep
on:
  workflow_call:
    inputs:
      eligibility-label:
        description: >-
          Label that marks a PR as approved for auto-merge. Applied by the
          reactive dependabot-automerge workflow when its policy passes.
          Must match that workflow's eligibility-label.
        type: string
        required: false
        default: "automerge: eligible"
permissions:
  contents: write
  pull-requests: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    # Only run on a schedule or a manual dispatch. A pull_request event is
    # the reactive workflow's job, not this one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Merge Labeled Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL: ${{ inputs.eligibility-label }}
        run: |
          gh pr list --repo "${REPO}" --author 'app/dependabot' \
            --label "${LABEL}" --state open --limit 100 --json url \
            --jq '.[].url' |
          while read -r url; do
            # One look: count checks that are not green. `gh pr checks`
            # errors when a PR has no checks; that lands here as zero
            # blockers, which merges — a repository without CI already
            # accepts every change unverified.
            blocked=$(gh pr checks "${url}" --json bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel" or .bucket == "pending")] | length' \
              2>/dev/null) || true
            if [ "${blocked:-0}" -eq 0 ]; then
              gh pr review --approve "${url}" &&
                gh pr merge --squash "${url}" ||
                echo "failed to merge ${url}" >&2
            else
              echo "skipping ${url}: ${blocked} check(s) not green"
            fi
          done
