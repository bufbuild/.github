# Reusable workflow that enables GitHub native auto-merge on Dependabot PRs
# matching a confidence policy: routine patch/minor version bumps. Major
# updates always wait for a human; adding the eligibility label by hand is
# the deliberate override. Merges are always squash, per org git standards.
#
# Two merge strategies, selected by defer-to-sweep:
#   false (default): GitHub native auto-merge (`gh pr merge --auto`). Free,
#     but only waits for CI if the default branch has required status
#     checks. Without them it merges immediately — so this strategy
#     REQUIRES required status checks.
#   true: no merge here at all. Eligible PRs are only labeled; the
#     scheduled dependabot-automerge-sweep workflow merges them once CI
#     has finished. Use on repositories with no required status checks.
# Eligible PRs are always labeled (eligibility-label) so the sweep can
# merge them without re-deriving the classification, which is impossible
# at schedule time. See workflow-templates/README.md for adoption
# prerequisites.
name: dependabot-automerge
on:
  workflow_call:
    inputs:
      target:
        description: >-
          Highest semver update type to auto-merge: patch or minor.
        type: string
        required: false
        default: minor
      defer-to-sweep:
        description: >-
          Do not merge here; only label eligible PRs and let the scheduled
          dependabot-automerge-sweep workflow merge them once CI has
          finished. Use on repositories whose default branch has no
          required status checks (where native auto-merge would merge
          immediately). Requires the sweep workflow to be installed, or
          labeled PRs will never merge.
        type: boolean
        required: false
        default: false
      eligibility-label:
        description: >-
          Label recorded on PRs that pass the merge policy (and removed on
          re-evaluation from PRs that no longer do). The nightly
          dependabot-automerge-sweep workflow merges by this label. Must
          match the sweep's eligibility-label.
        type: string
        required: false
        default: "automerge: eligible"
permissions:
  contents: write
  pull-requests: write
  # Creating the eligibility label and adding/removing it on PRs are
  # Issues-API operations; without this the label steps 403.
  issues: write
jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # The eligibility policy appears in the next three step guards; keep
      # them identical (the second is the negation of the first).
      - name: Label Eligible PR
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (inputs.target == 'minor' &&
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          LABEL: ${{ inputs.eligibility-label }}
        run: |
          gh label create "${LABEL}" --repo "${REPO}" --force --color 2f7d63 \
            --description "Dependabot PR approved by policy for auto-merge"
          gh pr edit "${PR_URL}" --add-label "${LABEL}"
      - name: Remove Stale Label
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          (inputs.target != 'minor' ||
           steps.metadata.outputs.update-type != 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          LABEL: ${{ inputs.eligibility-label }}
        run: gh pr edit "${PR_URL}" --remove-label "${LABEL}" || true
      - name: Enable Auto-Merge
        if: >-
          !inputs.defer-to-sweep &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           (inputs.target == 'minor' &&
            steps.metadata.outputs.update-type == 'version-update:semver-minor'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "${PR_URL}"
          gh pr merge --auto --squash "${PR_URL}"
